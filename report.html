<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>DỰ ÁN DATA NHÀ CHỐNG LŨ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: 'Segoe UI', Arial; background:#f4f6f9; padding:20px; }
.card { background:white; padding:15px 20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:inline-block; margin-bottom:20px; }
.controls { background:white; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:15px; }
button { cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px; padding:6px; }
table { border-collapse: collapse; width:100%; background:white; }
th, td { border:1px solid #eee; padding:6px; font-size:13px; }
.hidden-col { display:none; }
</style>

</head>

<body>

<h2>DỰ ÁN DATA NHÀ CHỐNG LŨ</h2>

<div class="card">
    <h3>Tổng hồ sơ</h3>
    <div id="totalCount">0</div>
</div>

<div class="controls">
<input type="text" id="searchInput" placeholder="Tìm kiếm...">
<button onclick="resetFilter()">Reset</button>
</div>

<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>

<script>

let fullData = [];
let filteredData = [];
let columnsMeta = {};
let currentPage = 1;

Promise.all([
fetch("data.json").then(res => res.json()),
fetch("columns.json").then(res => res.json())
]).then(([data, meta]) => {
fullData = data;
filteredData = data;
columnsMeta = meta;
renderTable();
});

function renderTable() {

tableHead.innerHTML = "";
tableBody.innerHTML = "";

if (!filteredData.length) return;

const columns = Object.keys(columnsMeta);

let headerRow = "<tr>";
columns.forEach(col => {
headerRow += `<th>${columnsMeta[col]}</th>`;
});
headerRow += "</tr>";
tableHead.innerHTML = headerRow;

filteredData.forEach(row => {

let rowHTML = "<tr>";

columns.forEach(col => {

let value = row[col] ?? "";

const fileFields = ["cam_ket", "BB_giao_tien_1"];

if (fileFields.includes(col)) {

    const attachmentId = row[col];
    const recordId = row["_id"];

    if (attachmentId) {

        const fileUrl = `/file?attachment_id=${attachmentId}&record_id=${recordId}`;

        value = `
            <button onclick="previewFile('${fileUrl}')">👁</button>
            <a href="${fileUrl}" target="_blank">
                <button>⬇</button>
            </a>
        `;
    } else {
        value = "";
    }
}

rowHTML += `<td>${value}</td>`;   // ✅ FIX QUAN TRỌNG

});

rowHTML += "</tr>";
tableBody.innerHTML += rowHTML;

});

}

function previewFile(url) {
document.getElementById("previewFrame").src = url;
document.getElementById("previewModal").style.display = "flex";
}

function closePreview() {
document.getElementById("previewModal").style.display = "none";
document.getElementById("previewFrame").src = "";
}

</script>

<div id="previewModal" style="
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
">
<div style="background:white;width:80%;height:80%;">
<button onclick="closePreview()">X</button>
<iframe id="previewFrame" style="width:100%;height:100%;"></iframe>
</div>
</div>

</body>
</html>
