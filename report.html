<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>DỰ ÁN DATA NHÀ CHỐNG LŨ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; padding:20px; background:#f4f6f9; }
table { width:100%; border-collapse:collapse; background:white; }
th, td { border:1px solid #ddd; padding:6px; }
button { padding:4px 6px; margin:2px; cursor:pointer; }
</style>

</head>

<body>

<h2>DỰ ÁN DATA</h2>

<div>Tổng hồ sơ: <span id="totalCount">0</span></div>

<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>

<script>

let fullData = [];
let columnsMeta = {};

Promise.all([
fetch("data.json").then(res => res.json()),
fetch("columns.json").then(res => res.json())
]).then(([data, meta]) => {

console.log("DATA:", data); // DEBUG

fullData = data;
columnsMeta = meta;

document.getElementById("totalCount").innerText = data.length;

renderTable();

}).catch(err => {
console.error("LOAD ERROR:", err);
});

function renderTable() {

const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");

tableHead.innerHTML = "";
tableBody.innerHTML = "";

if (!fullData.length) {
tableBody.innerHTML = "<tr><td>Không có dữ liệu</td></tr>";
return;
}

const columns = Object.keys(columnsMeta);

// HEADER
let headerRow = "<tr>";
columns.forEach(col => {
headerRow += `<th>${columnsMeta[col]}</th>`;
});
headerRow += "</tr>";
tableHead.innerHTML = headerRow;

// BODY
fullData.forEach(row => {

let rowHTML = "<tr>";

columns.forEach(col => {

let value = row[col] ?? "";

const fileFields = ["cam_ket", "BB_giao_tien_1"];

if (fileFields.includes(col)) {

    const attachmentId = row[col];
    const recordId = row["_id"];

    if (attachmentId && recordId) {

        const fileUrl = `/file?attachment_id=${attachmentId}&record_id=${recordId}`;

        value = `
            <button onclick="previewFile('${fileUrl}')">👁</button>
            <a href="${fileUrl}" target="_blank">
                <button>⬇</button>
            </a>
        `;
    } else {
        value = "";
    }
}

rowHTML += `<td>${value}</td>`;

});

rowHTML += "</tr>";
tableBody.innerHTML += rowHTML;

});

}

// PREVIEW
function previewFile(url) {
document.getElementById("previewFrame").src = url;
document.getElementById("previewModal").style.display = "flex";
}

function closePreview() {
document.getElementById("previewModal").style.display = "none";
document.getElementById("previewFrame").src = "";
}

</script>

<div id="previewModal" style="
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
">
<div style="background:white;width:80%;height:80%;">
<button onclick="closePreview()">X</button>
<iframe id="previewFrame" style="width:100%;height:100%;"></iframe>
</div>
</div>

</body>
</html>
